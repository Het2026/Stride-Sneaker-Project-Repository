<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Stride Sneaker Store</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=DM+Sans:wght@400;500;700&display=swap">
<style>
/* Layout: bento home with a hero that swaps silhouettes and colourways; shop = filter rail + grid; flow pages in two columns. */
:root{
  --bg:#F1EEFF;--surface:#FFFFFF;--surface2:#F6F4FF;--line:#DDD7F3;--fg:#14112B;--mute:#6A6585;
  --acc:#5B3DFF;--acc2:#8B5CFF;--pop:#FFE45C;--popfg:#14112B;--coral:#FF6B4A;
  --good:#0E9F6E;--bad:#E11D48;--shadow:0 20px 40px -22px rgba(50,30,140,.45);
  --c1:#9B6BFF;--c2:#4B2BD6;
  --text:var(--fg);--panel:var(--surface);--panel2:var(--surface2);
  --display:'Bricolage Grotesque','Arial Black',system-ui,sans-serif;--body:'DM Sans',system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E0C1A;--surface:#181530;--surface2:#211D40;--line:#342F58;--fg:#F4F2FF;--mute:#A9A4C8;--acc:#8F7BFF;--acc2:#B39DFF;--good:#4ADE9A;--bad:#FF6B8A;--shadow:0 20px 40px -22px rgba(0,0,0,.8);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0E0C1A;--surface:#181530;--surface2:#211D40;--line:#342F58;--fg:#F4F2FF;--mute:#A9A4C8;--acc:#8F7BFF;--acc2:#B39DFF;--good:#4ADE9A;--bad:#FF6B8A;--shadow:0 20px 40px -22px rgba(0,0,0,.8);color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:400 15px/1.55 var(--body);padding-block:0 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;padding-block:12px}
.bar0{display:flex;align-items:center;gap:10px;background:color-mix(in srgb,var(--surface) 86%,transparent);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:99px;padding:8px 10px 8px 22px;box-shadow:var(--shadow)}
.logo{font:800 22px var(--display);letter-spacing:-.05em;background:none;border:0;padding:0}
.logo i{font-style:normal;color:var(--acc)}
.links{display:flex;gap:2px;margin-left:14px}
.links button{background:none;border:0;padding:8px 14px;border-radius:99px;color:var(--mute);font-weight:500}
.links button:hover,.links button.on{background:var(--surface2);color:var(--fg)}
.nav-r{margin-left:auto;display:flex;gap:8px;align-items:center}
.ibtn{border:0;border-radius:99px;background:var(--surface2);padding:9px 16px;font-weight:700;display:inline-flex;gap:8px;align-items:center}
.ibtn b{display:inline-grid;place-items:center;min-width:20px;height:20px;border-radius:99px;background:var(--acc);color:#fff;font-size:12px;padding:0 5px}
.ibtn.go{background:var(--fg);color:var(--bg)}
.btn{border:0;border-radius:99px;padding:15px 28px;font-weight:700;background:var(--acc);color:#fff;transition:transform .2s,box-shadow .2s;box-shadow:0 12px 28px -12px var(--acc)}
.btn:hover{transform:translateY(-2px)}
.btn.ghost{background:var(--surface);color:var(--fg);box-shadow:none;border:1px solid var(--line)}
.btn.block{width:100%}
h1,h2,h3{font-family:var(--display);letter-spacing:-.04em;line-height:1;margin:0;text-wrap:balance}
h1{font-size:clamp(42px,7.4vw,96px);font-weight:800}
h2{font-size:clamp(26px,3.6vw,44px);font-weight:800}
h3{font-size:18px;font-weight:700;letter-spacing:-.02em;line-height:1.15}
.mute{color:var(--mute)}.small{font-size:13px;color:var(--mute)}
section{padding-block:48px 0}
.sticker{display:inline-block;background:var(--pop);color:var(--popfg);font-weight:800;padding:6px 14px;border-radius:99px;font-size:13px;transform:rotate(-3deg)}
/* hero */
.herocard{position:relative;border-radius:40px;padding:clamp(22px,4vw,52px);overflow:hidden;display:grid;grid-template-columns:1fr 1.05fr;gap:16px;align-items:center;background:linear-gradient(135deg,color-mix(in srgb,var(--c1) 55%,var(--surface)),color-mix(in srgb,var(--c2) 35%,var(--surface)));transition:background .8s;margin-top:6px}
.herocard p{max-width:44ch;font-size:17px;margin:18px 0 24px}
.ctas{display:flex;gap:12px;flex-wrap:wrap}
.pillrow{display:flex;gap:6px;flex-wrap:wrap;margin-top:22px}
.pillrow button{border:1px solid color-mix(in srgb,var(--fg) 25%,transparent);background:color-mix(in srgb,var(--surface) 55%,transparent);border-radius:99px;padding:7px 14px;font-weight:700;font-size:13px}
.pillrow button.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.stage{position:relative;aspect-ratio:1/.9;display:grid;place-items:center;perspective:1100px;min-width:0}
.orb{position:absolute;border-radius:50%}
.orb.a{width:70%;aspect-ratio:1;background:radial-gradient(circle at 30% 30%,#fff9,transparent 55%),var(--c1);opacity:.55;animation:pulse 7s ease-in-out infinite;transition:background .8s}
.orb.b{width:12%;aspect-ratio:1;top:6%;right:8%;background:var(--pop);animation:bob 5s ease-in-out infinite}
.orb.c{width:7%;aspect-ratio:1;bottom:12%;left:6%;background:var(--coral);animation:bob 6s ease-in-out -2s infinite}
.tilt-in{transform-style:preserve-3d;transition:transform .15s ease-out;width:100%}
.stage .tilt-in{width:108%;margin-left:-4%}
.float{animation:float 5s ease-in-out infinite;filter:drop-shadow(0 28px 22px rgba(20,10,60,.35))}
.stage .sticker{position:absolute;right:2%;bottom:8%;transform:rotate(5deg) translateZ(60px);font-size:14px}
@keyframes float{50%{transform:translateY(-14px) rotate(-1.5deg)}}
@keyframes pulse{50%{transform:scale(1.06)}}
@keyframes bob{50%{transform:translateY(-16px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pop{from{transform:scale(0)}}
.dots{display:flex;gap:9px;flex-wrap:wrap}
.dot{width:28px;height:28px;border-radius:50%;border:2px solid color-mix(in srgb,var(--fg) 20%,transparent);padding:0;transition:transform .2s}
.dot:hover{transform:scale(1.12)}
.dot.on{outline:2px solid var(--fg);outline-offset:3px}
.marq{overflow:hidden;margin-top:18px;background:var(--fg);color:var(--bg);border-radius:99px;padding-block:12px;white-space:nowrap}
.marq div{display:inline-block;animation:mq 34s linear infinite;font:800 18px var(--display);letter-spacing:-.02em}
.marq span{margin-inline:22px}
@keyframes mq{to{transform:translateX(-50%)}}
/* bento */
.bento{display:grid;grid-template-columns:repeat(6,1fr);gap:14px}
.bt{background:var(--surface);border:1px solid var(--line);border-radius:30px;padding:20px;display:flex;flex-direction:column;justify-content:space-between;gap:10px;min-width:0;text-align:left;overflow:hidden;transition:transform .2s}
button.bt:hover{transform:translateY(-3px)}
.bt.s2{grid-column:span 2}.bt.s3{grid-column:span 3}.bt.s4{grid-column:span 4}
.bt .sh{margin:0 -8px}
.bt.tone{background:linear-gradient(150deg,color-mix(in srgb,var(--acc) 22%,var(--surface)),var(--surface))}
.bt.pop{background:var(--pop);color:var(--popfg);border-color:transparent}
.bt.pop .small,.bt.pop .mute{color:#4b4320}
.swr{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:52px;height:52px;border-radius:50%;border:3px solid var(--surface);box-shadow:0 0 0 1px var(--line);padding:0;transition:transform .2s}
.sw:hover{transform:scale(1.1) rotate(-6deg)}
/* cards */
.head{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
.card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:28px;padding:12px 12px 16px;display:flex;flex-direction:column;gap:8px;cursor:pointer;transition:transform .25s,box-shadow .25s;min-width:0}
.card:hover{transform:translateY(-4px);box-shadow:var(--shadow)}
.card .img{aspect-ratio:4/3;border-radius:20px;display:grid;place-items:center;perspective:700px;overflow:hidden;position:relative}
.card .img .tilt-in{width:94%}
.card .meta{padding-inline:6px;display:grid;gap:4px}
.card .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.brand{font-size:13px;color:var(--mute);font-weight:500}
.price{font:800 18px var(--display);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.badge{position:absolute;left:10px;top:10px;z-index:2;background:var(--pop);color:var(--popfg);font-size:12px;font-weight:800;padding:4px 10px;border-radius:99px;transform:rotate(-4deg)}
.heart{position:absolute;right:10px;top:10px;z-index:2;width:36px;height:36px;border-radius:50%;border:0;background:color-mix(in srgb,var(--surface) 80%,transparent);font-size:17px;display:grid;place-items:center;padding:0;color:var(--fg)}
.heart.on{background:var(--coral);color:#fff}
.mini{display:flex;gap:4px}.mini i{width:11px;height:11px;border-radius:50%;display:block;border:1px solid rgba(0,0,0,.18)}
.tag{font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--surface2);color:var(--mute);white-space:nowrap}
.tag.Luxury{background:#3d3210;color:#f0d36b}.tag.Indie{background:#d6fff3;color:#0b6b57}.tag.Premium{background:#e5deff;color:#4128c9}
:root[data-theme="dark"] .tag.Indie{background:#0f3d33;color:#6ee7cf}:root[data-theme="dark"] .tag.Premium{background:#2c2466;color:#c6b9ff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tag.Indie{background:#0f3d33;color:#6ee7cf}:root:not([data-theme="light"]) .tag.Premium{background:#2c2466;color:#c6b9ff}}
.brands{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.bn{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:18px;text-align:left;display:grid;gap:10px;transition:transform .2s,border-color .2s}
.bn:hover{transform:translateY(-3px);border-color:var(--acc)}
.bn b{font:800 21px var(--display);letter-spacing:-.04em;line-height:1.05}
.bn.in{background:linear-gradient(150deg,color-mix(in srgb,var(--coral) 18%,var(--surface)),var(--surface))}
/* shop */
.shop{display:grid;grid-template-columns:270px 1fr;gap:22px;align-items:start;padding-top:18px}
.side{background:var(--surface);border:1px solid var(--line);border-radius:28px;padding:18px;position:sticky;top:84px;max-height:calc(100vh - 100px);overflow:auto}
.side summary{font:800 18px var(--display);letter-spacing:-.03em;cursor:pointer;list-style:none;display:flex;justify-content:space-between}
.fg{display:grid;gap:8px;margin-top:16px}
.fg h4{margin:0;font-size:13px;color:var(--mute);font-weight:700}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface2);border-radius:99px;padding:6px 12px;font-weight:500;font-size:13px;display:inline-flex;gap:6px;align-items:center}
.chip.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip i{width:12px;height:12px;border-radius:50%;display:inline-block;border:1px solid rgba(0,0,0,.2)}
input[type=range]{width:100%;accent-color:var(--acc)}
input[type=search],input[type=text],input[type=tel],input[type=email],select{background:var(--surface2);border:1px solid var(--line);border-radius:14px;padding:12px 14px;color:var(--fg);font:inherit;width:100%;min-width:0}
input:invalid:not(:placeholder-shown){border-color:var(--bad)}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.toolbar input{flex:1;min-width:180px}.toolbar select{width:auto}
/* product */
.pdp{display:grid;grid-template-columns:1.15fr 1fr;gap:28px;padding-top:12px}
.pdp .stage{aspect-ratio:1/.9;border-radius:40px;background:linear-gradient(135deg,color-mix(in srgb,var(--c1) 45%,var(--surface)),color-mix(in srgb,var(--c2) 25%,var(--surface)));transition:background .8s}
.crumb{background:none;border:0;color:var(--mute);padding:6px 0;font-weight:500}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:28px;padding:22px}
.sizes{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:8px}
.sizes button{background:var(--surface2);border:1px solid var(--line);border-radius:14px;padding:11px 0;font-weight:700}
.sizes button.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.sizes.err button{border-color:var(--bad)}
.err-msg{color:var(--bad);font-size:13px;min-height:20px}
.cmp{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.cmp th{font-size:13px;color:var(--mute);text-align:left;padding:8px 10px;font-weight:500}
.cmp td{padding:12px 10px;border-top:1px solid var(--line)}
.cmp td:not(:first-child),.cmp th:not(:first-child){text-align:right}
.cmp tr.us td{background:color-mix(in srgb,var(--acc) 14%,transparent);font-weight:700;border-top-color:transparent}
.cmp tr.us td:first-child{border-radius:14px 0 0 14px}.cmp tr.us td:last-child{border-radius:0 14px 14px 0}
.bar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;border-radius:99px;background:var(--mute)}
.bar.us i{background:linear-gradient(90deg,var(--acc),var(--acc2))}
.save{display:inline-block;background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good);padding:4px 12px;border-radius:99px;font-weight:700;font-size:13px}
.scroll{overflow-x:auto}
.perks{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;font-size:13px;color:var(--mute)}
.perks div{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px}
.perks b{display:block;color:var(--fg)}
.spec{display:grid;grid-template-columns:1fr 1fr;gap:8px 18px;font-size:14px}.spec span{color:var(--mute)}
/* flow */
.two{display:grid;grid-template-columns:1.6fr 1fr;gap:20px;padding-top:20px;align-items:start}
.line{display:grid;grid-template-columns:120px 1fr auto;gap:16px;align-items:center;padding:16px 0;border-top:1px solid var(--line)}
.line:first-of-type{border-top:0}
.line .img{background:var(--surface2);border-radius:20px;padding:8px}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:99px}
.qty button{background:none;border:0;width:34px;height:34px;font-size:18px}
.qty span{min-width:22px;text-align:center;font-variant-numeric:tabular-nums}
.sum{display:grid;gap:10px}.sum>div{display:flex;justify-content:space-between;gap:12px}
.sum .tot{border-top:1px solid var(--line);padding-top:14px;font:800 22px var(--display);letter-spacing:-.03em}
.link{background:none;border:0;color:var(--mute);text-decoration:underline;padding:0}
.steps{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--mute);padding-top:14px;flex-wrap:wrap}
.steps b{color:var(--fg)}
.steps .n{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--surface);border:1px solid var(--line);font-size:12px;margin-right:6px}
.steps .on .n{background:var(--acc);color:#fff;border-color:var(--acc)}
.steps i{width:26px;height:1px;background:var(--line)}
form{display:grid;gap:14px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
label{display:grid;gap:6px;font-size:13px;color:var(--mute);font-weight:500}
.opt{display:flex;gap:14px;align-items:center;border:1px solid var(--line);border-radius:18px;padding:14px;cursor:pointer;background:var(--surface2)}
.opt:has(input:checked){border-color:var(--acc);background:color-mix(in srgb,var(--acc) 12%,var(--surface2))}
.opt input{accent-color:var(--acc)}
.opt b{display:block;color:var(--fg)}
.proc{position:fixed;inset:0;background:color-mix(in srgb,var(--bg) 92%,transparent);display:grid;place-items:center;z-index:50;text-align:center}
.spin{width:54px;height:54px;border-radius:50%;border:4px solid var(--line);border-top-color:var(--acc);animation:spin .8s linear infinite;margin:0 auto 18px}
.ok{width:84px;height:84px;border-radius:50%;background:var(--acc);color:#fff;display:grid;place-items:center;margin:0 auto 18px;font-size:40px;animation:pop .5s cubic-bezier(.3,1.6,.5,1) both}
.center{text-align:center;max-width:560px;margin:56px auto 0}
.track{display:grid;grid-template-columns:1fr 1fr;gap:20px;padding-top:20px;align-items:start}
.st{display:grid;grid-template-columns:34px 1fr;gap:14px;padding-bottom:26px;position:relative}
.st::before{content:"";position:absolute;left:16px;top:30px;bottom:-2px;width:2px;background:var(--line)}
.st:last-child::before{display:none}.st.done::before{background:var(--acc)}
.st .d{width:34px;height:34px;border-radius:50%;background:var(--surface2);border:2px solid var(--line);display:grid;place-items:center;font-size:14px;z-index:1}
.st.done .d{background:var(--acc);border-color:var(--acc);color:#fff}
.st.now .d{box-shadow:0 0 0 6px color-mix(in srgb,var(--acc) 30%,transparent)}
.st small{color:var(--mute);display:block}
.st:not(.done):not(.now) b{color:var(--mute)}
.route{height:10px;border-radius:99px;background:var(--surface2);position:relative;margin:34px 6px 10px}
.route i{position:absolute;inset:0 auto 0 0;border-radius:99px;background:linear-gradient(90deg,var(--acc),var(--acc2));transition:width .9s}
.route u{position:absolute;top:50%;width:30px;height:30px;border-radius:50%;background:var(--fg);color:var(--bg);display:grid;place-items:center;transform:translate(-50%,-50%);transition:left .9s;text-decoration:none}
.rl{display:flex;justify-content:space-between;font-size:12px;color:var(--mute)}
footer{margin-top:64px;border-top:1px solid var(--line);padding-top:22px;color:var(--mute);font-size:13px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
.view{animation:fade .35s ease both}@keyframes fade{from{opacity:.0}to{opacity:1}}
.v3d{position:absolute;inset:0;z-index:1}
.hint{position:absolute;left:14px;bottom:12px;z-index:2;background:color-mix(in srgb,var(--surface) 82%,transparent);border-radius:99px;padding:6px 12px;font-size:12px;font-weight:700;color:var(--fg)}
.snap img{filter:drop-shadow(0 12px 10px rgba(30,15,80,.22))}
@media(max-width:900px){.herocard,.pdp,.two,.track,.shop{grid-template-columns:1fr}.links{display:none}.bt.s2,.bt.s3,.bt.s4{grid-column:span 6}.side{position:static;max-height:none}.line{grid-template-columns:90px 1fr}.line>:last-child{grid-column:2}.f2{grid-template-columns:1fr}.perks{grid-template-columns:1fr}}
@media(max-width:520px){.bar0{padding-left:16px}.ibtn .lbl{display:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
</style>
</head>
<body>

<nav><div class="wrap"><div class="bar0">
  <button class="logo" data-go="home" aria-label="Stride home">stride<i>.</i></button>
  <div class="links" id="links"></div>
  <div class="nav-r"><button class="ibtn" data-go="shop">Shop</button><button class="ibtn" data-go="wish" id="wishBtn" aria-label="Wishlist">♥<b>0</b></button><button class="ibtn go" data-go="cart" id="cartBtn"><span class="lbl">Bag</span><b>0</b></button><button class="ibtn" id="themeBtn" aria-label="Switch light or dark theme">◐</button></div>
</div></div></nav>
<main class="wrap" id="app"></main>
<div class="wrap"><footer><span>Stride is a design concept. Brands, stores and prices shown are fictional samples.</span><span>Prices in INR, tax included.</span></footer></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* name,u1,u2,toe/heel,accent,sole,soleShade,outsole,lace,tongue,pattern,family */
const CW=[
['Volt Runner','#D4FF4F','#7ED321','#12121A','#7B5CFF','#FFFFFF','#D9D9E6','#15151D','#12121A','#B6F23A','none'],
['Neon Dusk','#9B6BFF','#4B2BD6','#FF4D8D','#C6FF3D','#FFFFFF','#D9D9E6','#15151D','#FFFFFF','#6A44F0','stripes'],

<div class="f2"><label>Full name<input type="text" id="fn" required value="${S.addr.name}" placeholder="Your name"></label><label>Mobile<input type="tel" id="ph" required pattern="[0-9]{10}" value="${S.addr.phone}" placeholder="10-digit number"></label></div>
<label>Email<input type="email" id="em" required value="${S.addr.email}" placeholder="you@example.com"></label>
<label>Address<input type="text" id="ad" required value="${S.addr.line}" placeholder="Flat, building, street"></label>
<div class="f2"><label>City<input type="text" id="ct" required value="${S.addr.city}" placeholder="City"></label><label>PIN code<input type="text" id="pn" required pattern="[0-9]{6}" value="${S.addr.pin}" placeholder="6 digits"></label></div>
<h3 style="margin-top:8px">Delivery speed</h3>
<label class="opt"><input type="radio" name="sp" value="std" ${S.ship==='std'?'checked':''}><span><b>Standard, free</b>Arrives in 2–4 days</span></label>
<label class="opt"><input type="radio" name="sp" value="exp" ${S.ship==='exp'?'checked':''}><span><b>Express, ₹199</b>Arrives in 1–2 days</span></label>
<div class="err-msg" id="fe"></div><button class="btn" type="submit">Continue to payment</button></form>${summary()}</div></div>`;
V.payment=()=>!S.cart.length?empty():`<div class="view">${stepper(3)}<div class="two"><div class="panel" style="display:grid;gap:16px"><h2>Payment</h2><div class="chips">${[['upi','UPI'],['card','Card'],['cod','Cash on delivery']].map(t=>`<button class="chip ${S.pay===t[0]?'on':''}" style="padding:9px 18px;font-size:14px" data-act="pay" data-p="${t[0]}">${t[1]}</button>`).join('')}</div>
<form id="payForm" novalidate>${S.pay==='upi'?`<label>UPI ID<input type="text" id="upi" required placeholder="name@bank" pattern="[a-zA-Z0-9.\\-_]+@[a-zA-Z]+"></label><p class="small" style="margin:0">You will get a request in your UPI app. This is a demo and nothing is charged.</p>`:S.pay==='card'?`<label>Card number<input type="text" id="cn" required inputmode="numeric" placeholder="1234 5678 9012 3456" pattern="[0-9 ]{16,19}"></label><div class="f2"><label>Expiry<input type="text" id="ce" required placeholder="MM/YY" pattern="[0-9]{2}/[0-9]{2}"></label><label>CVV<input type="text" id="cv" required placeholder="123" pattern="[0-9]{3}"></label></div><label>Name on card<input type="text" id="cm" required placeholder="As printed on the card"></label><p class="small" style="margin:0">This is a demo form. Do not enter a real card number.</p>`:`<div class="opt"><span><b>Pay when it arrives</b>Cash or UPI to the courier.</span></div>`}
<div class="err-msg" id="pe"></div><button class="btn block" type="submit">${S.pay==='cod'?'Place order':'Pay '+inr(total())}</button></form></div>${summary()}</div></div>`;
V.done=()=>{const o=S.order;if(!o)return empty();return `<div class="center view"><div class="ok">✓</div><span class="sticker">Order ${o.id}</span><h1 style="font-size:clamp(34px,5vw,60px);margin:14px 0">It’s yours.</h1><p class="mute">We emailed your receipt. Your pair arrives by <b style="color:var(--fg)">${o.eta}</b> in ${o.city}.</p><div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:22px"><button class="btn" data-go="track">Track order</button><button class="btn ghost" data-go="shop">Keep shopping</button></div></div>`};
const STEPS=[['Order placed','Payment confirmed'],['Packed','Quality checked at our Bhiwandi hub'],['Shipped','Handed to the courier'],['Out for delivery','Courier is in your area'],['Delivered','Signed for at your door']];
V.track=()=>{const o=S.order;if(!o)return `<div class="center view"><h2>Track an order</h2><p class="mute">Place an order and its steps will show up here.</p><button class="btn" data-go="shop">Shop sneakers</button></div>`;const n=S.stepN,pct=n/4*100;
 return `<div class="view"><div style="padding-top:20px"><span class="sticker">Order ${o.id}</span><h1 style="font-size:clamp(34px,5vw,60px);margin-top:12px">${n===4?'Delivered':STEPS[n][0]}</h1></div>
<div class="track"><div class="panel">${STEPS.map((s,i)=>`<div class="st ${i<n||n===4?'done':''} ${i===n&&n<4?'now':''}"><div class="d">${i<n||n===4?'✓':i+1}</div><div><b>${s[0]}</b><small>${i<=n?s[1]:'Pending'}</small>${i<=n?`<small>${o.times[i]||''}</small>`:''}</div></div>`).join('')}
<button class="btn ghost" data-act="adv" ${n>=4?'disabled style="opacity:.5"':''}>Demo: move to the next step</button></div>
<div style="display:grid;gap:16px"><div class="panel"><h3>Journey</h3><div class="route"><i style="width:${pct}%"></i><u style="left:${pct}%">➜</u></div><div class="rl"><span>Bhiwandi hub</span><span>${o.city}</span></div></div>
<div class="panel sum"><h3>Items</h3>${o.items.map(c=>`<div><span class="mute">${prod(c.pid).name}, ${CW[c.cw].n}, UK ${c.size}, ${c.qty} ${c.qty>1?'pairs':'pair'}</span></div>`).join('')}<div class="tot"><span>Paid</span><span>${inr(o.total)}</span></div><div class="small">Ship to: ${o.addr}</div><div class="small">Courier: Stride Express, AWB ${o.awb}</div></div></div></div></div>`};
let HERO=null,PDP=null;
function render(){const r=S.route;LIVE.slice().forEach(c=>c.dispose());HERO=PDP=null;$('#app').innerHTML=V[r]();$('#cartBtn').innerHTML=`<span class="lbl">Bag</span><b>${cartCount()}</b>`;$('#wishBtn').innerHTML=`♥<b>${S.wish.length}</b>`;
 $('#links').innerHTML=[['home','Home'],['shop','Shop'],['wish','Wishlist'],['track','Orders']].map(l=>`<button class="${l[0]===r?'on':''}" data-go="${l[0]}">${l[1]}</button>`).join('');
 accent(r==='product'?S.cw:r==='home'?S.hero:11);
 const sd=$('#side');if(sd&&innerWidth>900)sd.open=true;
 bindShop();bindForms();window.scrollTo({top:0});
 if($('#heroShoe'))HERO=mount3D($('#heroShoe'),S.hero,S.hst);
 if($('#pShoe'))PDP=mount3D($('#pShoe'),S.cw,prod(S.pid).style);
 hydrate()}
function bindShop(){const q=$('#q');if(q)q.oninput=()=>{S.f.q=q.value.trim().toLowerCase();S.shown=24;upd()};const so=$('#sort');if(so){so.value=S.sort;so.onchange=()=>{S.sort=so.value;upd()}}
 const pm=$('#pmax');if(pm)pm.oninput=()=>{S.f.max=+pm.value;$('#pv').textContent=inr(S.f.max);S.shown=24;upd()}}
function upd(){const r=results();$('#results').innerHTML=r.html;$('#cnt').textContent=r.n+' pairs';hydrate($('#results'))}
function go(r){if(!ROUTES.includes(r))r='home';if(r==='product'&&!S.pid)r='shop';S.route=r;if(location.hash!=='#'+r)history.replaceState(null,'','#'+r);render()}
function resetF(){S.f={tier:[],brand:[],style:[],color:[],gender:[],origin:[],max:80000,q:''};S.shown=24}
function tog(k,v){const a=S.f[k],i=a.indexOf(v);i<0?a.push(v):a.splice(i,1)}
function act(e){const g=e.target.closest('[data-go]');if(g){go(g.dataset.go);return}
 const a=e.target.closest('[data-act]');if(!a)return;const d=a.dataset;
 if(d.act==='open'){S.pid=+d.id;S.cw=prod(S.pid).cw;S.size=null;S.err=false;go('product')}
 if(d.act==='wish'){const id=+d.id,i=S.wish.indexOf(id);i<0?S.wish.push(id):S.wish.splice(i,1);if(S.route==='wish')render();else{document.querySelectorAll(`.heart[data-id="${id}"]`).forEach(h=>h.classList.toggle('on',i<0));$('#wishBtn').innerHTML=`♥<b>${S.wish.length}</b>`}}
 if(d.act==='hero'){S.hero=+d.i;accent(S.hero);HERO&&HERO.set(S.hero,S.hst);$('#heroName').textContent=CW[S.hero].n;document.querySelectorAll('.dot').forEach((x,i)=>x.classList.toggle('on',i===S.hero))}
 if(d.act==='hst'){S.hst=d.s;HERO&&HERO.set(S.hero,S.hst);document.querySelectorAll('.pillrow button').forEach(x=>x.classList.toggle('on',x.dataset.s===S.hst))}
 if(d.act==='cw'){S.cw=+d.i;accent(S.cw);PDP&&PDP.set(S.cw,prod(S.pid).style);$('#cwName').textContent=CW[S.cw].n;document.querySelectorAll('.dot').forEach(x=>x.classList.toggle('on',+x.dataset.i===S.cw))}
 if(d.act==='size'){S.size=+d.s;S.err=false;document.querySelectorAll('.sizes button').forEach(x=>x.classList.toggle('on',+x.dataset.s===S.size));$('.sizes').classList.remove('err');$('.err-msg').textContent=''}
 if(d.act==='add'){if(!S.size){S.err=true;$('.sizes').classList.add('err');$('.err-msg').textContent='Choose a size to add this pair.';return}
  const ex=S.cart.find(c=>c.pid===S.pid&&c.cw===S.cw&&c.size===S.size);if(ex)ex.qty++;else S.cart.push({pid:S.pid,cw:S.cw,size:S.size,qty:1});go('cart')}
 if(d.act==='ft'){tog(d.k,d.k==='brand'?+d.v:d.v);S.shown=24;a.classList.toggle('on');upd()}
 if(d.act==='clear'){e.preventDefault();resetF();render()}
 if(d.act==='more'){S.shown+=24;upd()}
 if(d.act==='sty'){resetF();S.f.style=[d.s];go('shop')}
 if(d.act==='col'){resetF();S.f.color=[d.c];go('shop')}
 if(d.act==='origin'){resetF();S.f.origin=[d.o];go('shop')}
 if(d.act==='brand'){resetF();S.f.brand=[+d.b];go('shop')}
 if(d.act==='inc'){S.cart[+d.i].qty++;render()}
 if(d.act==='dec'){const c=S.cart[+d.i];c.qty--;if(c.qty<1)S.cart.splice(+d.i,1);render()}
 if(d.act==='rm'){S.cart.splice(+d.i,1);render()}
 if(d.act==='coupon'){S.coupon=$('#coupon').value.trim().toUpperCase();render()}
 if(d.act==='pay'){S.pay=d.p;render()}
 if(d.act==='adv'&&S.stepN<4){S.stepN++;S.order.times[S.stepN]=new Date().toLocaleString('en-IN',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});render()}}
document.addEventListener('click',act);
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('.card')){e.preventDefault();act(e)}});
$('#themeBtn').onclick=()=>{const r=document.documentElement,dk=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;r.dataset.theme=dk?'light':'dark'};
function bindForms(){const sf=$('#shipForm');if(sf)sf.onsubmit=e=>{e.preventDefault();const ok=sf.checkValidity();$('#fe').textContent=ok?'':'Fill in every field. Mobile needs 10 digits and PIN code 6 digits.';if(!ok)return;
  S.addr={name:$('#fn').value,phone:$('#ph').value,email:$('#em').value,line:$('#ad').value,city:$('#ct').value,pin:$('#pn').value};S.ship=sf.querySelector('input[name=sp]:checked').value;go('payment')};
 const pf=$('#payForm');if(pf)pf.onsubmit=e=>{e.preventDefault();if(!pf.checkValidity()){$('#pe').textContent='Check the details and try again.';return}
  const p=document.createElement('div');p.className='proc';p.innerHTML='<div><div class="spin"></div><h3>Confirming your payment</h3><p class="mute">Keep this page open.</p></div>';document.body.appendChild(p);
  setTimeout(()=>{p.remove();const d=new Date();const eta=new Date(Date.now()+(S.ship==='exp'?2:4)*864e5).toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short'});
   S.order={id:'STR-'+Math.floor(100000+Math.random()*900000),eta,city:S.addr.city,total:total(),items:S.cart.map(c=>({...c})),addr:`${S.addr.line}, ${S.addr.city} ${S.addr.pin}`,awb:'SX'+Math.floor(1e9+Math.random()*9e9),times:[d.toLocaleString('en-IN',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})]};
   S.stepN=0;S.cart=[];S.coupon='';go('done')},1600)}}
document.addEventListener('pointermove',e=>{document.querySelectorAll('.tilt').forEach(t=>{const i=t.querySelector('.tilt-in');if(!i)return;const r=t.getBoundingClientRect();
 if(e.clientX<r.left-40||e.clientX>r.right+40||e.clientY<r.top-40||e.clientY>r.bottom+40){i.style.transform='';return}
 const x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;i.style.transform=`rotateY(${x*20}deg) rotateX(${-y*14}deg)`})});
window.addEventListener('hashchange',()=>{const r=location.hash.slice(1);if(r&&r!==S.route)go(r)});
go(ROUTES.includes(location.hash.slice(1))?location.hash.slice(1):'home');
</script>
</body>
</html>
